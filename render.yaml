# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click starting point for deploying this app on Render. After deploying:
#  1. Fill in the env vars marked `sync: false` in the Render dashboard
#     (API keys for OpenAI/Anthropic/Twilio/Brevo/Stripe, S3 credentials).
#  2. Update ALLOWED_ORIGINS on the backend once the dashboard's real URL is known.
#  3. Update VITE_API_BASE_URL on the dashboard once the backend's real URL is known.
#
# This does NOT configure S3/R2 for voice note storage or any of the third-party
# provider accounts (Stripe, Twilio, Brevo, OpenAI, Anthropic) — those are
# your accounts to create; only the credentials plug in here.

databases:
  - name: offices-app-db
    plan: starter
    databaseName: offices_app
    user: offices_app

services:
  - type: web
    name: offices-app-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: offices-app-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: offices-app-dashboard
    runtime: static
    buildCommand: cd dashboard && npm ci && npm run build
    staticPublishPath: ./dashboard/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_BASE_URL
        sync: false
    routes:
      # SPA fallback so client-side routes like /pay/:token and /clients/:id
      # work on a hard refresh instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
